<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>scan-P｜ドキュメントスキャナ（台形補正）</title>
  <!-- アイコン / ホーム画面追加（PWA） -->
  <link rel="icon" href="favicon.svg?v=25" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png?v=25" sizes="32x32" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=25" />
  <link rel="manifest" href="manifest.webmanifest?v=25" />
  <meta name="theme-color" content="#c13b25" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="scan-P" />
  <link rel="stylesheet" href="style.css?v=26" />
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">scan-P</h1>
    <p class="app-subtitle">ブラウザだけで完結する台形補正ドキュメントスキャナ</p>
  </header>

  <main class="container">
    <!-- ステータス -->
    <div id="status" class="status" hidden></div>

    <!-- 作業エリア -->
    <section class="workspace">
      <div class="panel card">
        <h2 class="panel-title">元画像 ＋ 頂点調整</h2>
        <div class="src-input">
          <label class="btn btn-primary src-in-btn">
            <input type="file" id="fileInput" accept="image/*" hidden />
            <span>📷 画像を選択</span>
          </label>
          <button id="pasteBtn" class="btn btn-ghost src-in-btn">📋 貼り付け</button>
        </div>
        <div class="canvas-wrap" id="srcWrap">
          <canvas id="srcCanvas"></canvas>
          <canvas id="overlayCanvas" class="overlay"></canvas>
          <canvas id="loupe" class="loupe" hidden></canvas>
          <p class="placeholder" id="srcPlaceholder">画像を選択／貼り付けしてください</p>
        </div>
        <p class="hint">オレンジの点＝角を移動（画像の外＝余白にも置けます）／青いひし形＝辺をそのまま平行移動</p>
        <!-- 編集中のキャンバスのすぐ下に主要アクション -->
        <div class="src-actions">
          <button id="autoBtn" class="btn btn-ghost" hidden>✨ 自動で枠検出</button>
          <button id="warpBtn" class="btn btn-accent btn-big" disabled>✂️ この枠で補正する</button>
        </div>
      </div>

      <div class="panel card">
        <h2 class="panel-title">補正結果</h2>

        <div class="canvas-wrap result-wrap" id="dstWrap">
          <canvas id="dstCanvas"></canvas>
          <p class="placeholder" id="dstPlaceholder">「この枠で補正する」を押すと結果が表示されます</p>
        </div>

        <!-- 後処理ツール（結果画像のすぐ下） -->
        <div class="result-tools" id="resultTools" hidden>
          <div class="tool-row">
            <span class="tool-label">仕上げ</span>
            <div class="segmented" id="filterSeg">
              <button class="seg-btn is-active" data-filter="color">カラー</button>
              <button class="seg-btn" data-filter="gray">グレー</button>
              <button class="seg-btn" data-filter="bw">白黒</button>
            </div>
          </div>
          <div class="tool-row" id="bwRow">
            <span class="tool-label">濃さ<small class="only-note">白黒のみ</small></span>
            <span class="rng-end">薄</span>
            <input id="bwThresh" type="range" min="-30" max="30" step="1" value="0" aria-label="白黒のしきい値" disabled />
            <span class="rng-end">濃</span>
          </div>
          <div class="tool-row">
            <span class="tool-label">回転</span>
            <button id="rotL" class="btn btn-ghost btn-sm">⟲ 90°</button>
            <button id="rotR" class="btn btn-ghost btn-sm">⟳ 90°</button>
          </div>
          <div class="tool-row save-row">
            <button id="copyBtn" class="btn btn-accent save-btn">📋 コピー</button>
            <button id="savePhotoBtn" class="btn btn-primary save-btn">📷 写真に保存</button>
          </div>
          <div class="tool-row save-row">
            <button id="downloadPngBtn" class="btn btn-ghost save-btn">⬇️ PNG</button>
            <button id="downloadJpgBtn" class="btn btn-ghost save-btn">⬇️ JPEG</button>
          </div>
          <p class="save-hint" id="saveHint">
            <b>コピー</b>＝クリップボードへ／<b>写真に保存</b>＝スマホのアルバムへ／
            <b>PNG/JPEG</b>＝ダウンロード（PNG=高画質・文字くっきり / JPEG=軽量・写真向き）
          </p>
        </div>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <p>WebGL + HTML5 Canvas / フロントエンドのみで動作</p>
    <p class="build-stamp" id="buildStamp"></p>
  </footer>

  <script src="script.js?v=26"></script>
</body>
</html>
