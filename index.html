<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>scan-P｜ドキュメントスキャナ（台形補正）</title>
  <link rel="stylesheet" href="style.css?v=14" />
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">scan-P</h1>
    <p class="app-subtitle">ブラウザだけで完結する台形補正ドキュメントスキャナ</p>
  </header>

  <main class="container">
    <!-- 操作パネル -->
    <section class="toolbar card">
      <label class="btn btn-primary file-btn">
        <input type="file" id="fileInput" accept="image/*" hidden />
        <span>📷 画像を選択</span>
      </label>

      <button id="warpBtn" class="btn btn-accent" disabled>✂️ 補正実行</button>

      <button id="autoBtn" class="btn btn-ghost" hidden>✨ 自動で枠検出（任意）</button>
    </section>

    <!-- ステータス -->
    <div id="status" class="status" hidden></div>

    <!-- 作業エリア -->
    <section class="workspace">
      <div class="panel card">
        <h2 class="panel-title">元画像 ＋ 頂点調整</h2>
        <div class="canvas-wrap" id="srcWrap">
          <canvas id="srcCanvas"></canvas>
          <canvas id="overlayCanvas" class="overlay"></canvas>
          <canvas id="loupe" class="loupe" hidden></canvas>
          <p class="placeholder" id="srcPlaceholder">画像を選択してください</p>
        </div>
        <p class="hint">オレンジの点＝角を移動（画像の外＝余白にも置けます）／青いひし形＝辺をそのまま平行移動</p>
      </div>

      <div class="panel card">
        <h2 class="panel-title">補正結果</h2>

        <!-- 結果のすぐ近くに後処理ツール（スマホで戻らなくて済む） -->
        <div class="result-tools" id="resultTools" hidden>
          <div class="tool-row">
            <span class="tool-label">仕上げ</span>
            <div class="segmented" id="filterSeg">
              <button class="seg-btn is-active" data-filter="color">カラー</button>
              <button class="seg-btn" data-filter="gray">グレー</button>
              <button class="seg-btn" data-filter="bw">白黒</button>
            </div>
          </div>
          <div class="tool-row">
            <span class="tool-label">回転</span>
            <button id="rotL" class="btn btn-ghost btn-sm">⟲ 90°</button>
            <button id="rotR" class="btn btn-ghost btn-sm">⟳ 90°</button>
            <input id="rotFine" type="range" min="-15" max="15" step="1" value="0" aria-label="微調整" />
            <span id="rotFineVal" class="rot-val">0°</span>
          </div>
          <div class="tool-row">
            <button id="savePhotoBtn" class="btn btn-primary">📷 写真に保存</button>
            <button id="downloadPngBtn" class="btn btn-ghost btn-sm">⬇️ PNG</button>
            <button id="downloadJpgBtn" class="btn btn-ghost btn-sm">⬇️ JPEG</button>
          </div>
        </div>

        <div class="canvas-wrap result-wrap" id="dstWrap">
          <canvas id="dstCanvas"></canvas>
          <p class="placeholder" id="dstPlaceholder">「補正実行」を押すと結果が表示されます</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <p>WebGL + HTML5 Canvas / フロントエンドのみで動作</p>
    <p class="build-stamp" id="buildStamp"></p>
  </footer>

  <script src="script.js?v=14"></script>
</body>
</html>
