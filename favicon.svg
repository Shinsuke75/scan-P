<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8603c"/>
      <stop offset="0.55" stop-color="#c13b25"/>
      <stop offset="1" stop-color="#8b1a0a"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#3a0a02" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256,256) scale(0.96) translate(-256,-256)">
    <!-- 斜めの書類（台形＝パース） -->
    <polygon points="156,116 374,150 348,400 132,366" fill="#ffffff" filter="url(#sh)"/>
    <!-- 本文ライン -->
    <g stroke="#e3c7bb" stroke-width="11" stroke-linecap="round">
      <line x1="190" y1="192" x2="332" y2="214"/>
      <line x1="185" y1="232" x2="327" y2="254"/>
      <line x1="180" y1="272" x2="322" y2="294"/>
      <line x1="175" y1="312" x2="295" y2="330"/>
    </g>
    <!-- 角ハンドル（オレンジ） -->
    <g fill="#f59e0b" stroke="#ffffff" stroke-width="7">
      <circle cx="156" cy="116" r="24"/>
      <circle cx="374" cy="150" r="24"/>
      <circle cx="348" cy="400" r="24"/>
      <circle cx="132" cy="366" r="24"/>
    </g>
  </g>
</svg>